name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation
        run: npm ci

      - name: Analyse de dépendances (SCA)
        run: npm audit --audit-level=high

      - name: Syntaxe serveur
        run: find server/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Typecheck client
        run: npm run typecheck

      - name: Build client
        run: npm run build

      - name: Vérification des secrets versionnés
        run: |
          if git ls-files | grep -E '^\.env(\..+|-.*)?$' | grep -v '^\.env\.example$'; then
            echo "Des fichiers d'environnement sont versionnés." >&2
            exit 1
          fi
